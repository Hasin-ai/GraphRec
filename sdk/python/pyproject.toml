# The Python SDK's own distribution metadata.
#
# Separate from the repository root's `pyproject.toml`, which builds the server.
# The two are different artifacts with different audiences and — importantly —
# different Python floors: the server pins `>=3.12,<3.13` because it runs on one
# runtime we control, and an SDK that did the same would refuse most of the
# services that want to call it.
[project]
name = "graphrec-sdk"
version = "0.1.0"
description = "Call the GraphRec recommendation API from your own service."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # One HTTP library for both the blocking and the awaiting client. The
    # alternative — `urllib` for sync and `aiohttp` for async — is two connection
    # pools, two timeout models and two sets of exceptions to translate.
    "httpx>=0.27,<1",
    # The backend's own model layer, so the request models can be read against
    # the schemas that produced the API's. It also gives the SDK aware-datetime
    # enforcement for free, which is the check most worth doing locally.
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# `py.typed` is the whole point of shipping types: without it a consumer running
# mypy sees `Any` from every import and the annotations above are decoration.
[tool.setuptools.package-data]
graphrec_sdk = ["py.typed"]

# Linted by the repository's gate (`ruff check .` from the root), with the
# root's rule set and this package's Python floor. Ruff resolves configuration
# per file against the nearest `pyproject.toml` that has a `[tool.ruff]`
# section, so this is what applies under `sdk/python/` — and without it the
# `UP` rules would rewrite this source into 3.12-only syntax, which is the one
# thing this package must not be.
[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py310"

[tool.ruff.lint.extend-per-file-ignores]
# Pydantic resolves annotations at runtime — both to build a model's validators
# and to bind `field_serializer` signatures. `datetime` must be a real import
# here; moving it into a type-checking block raises `NameError` at import.
"src/graphrec_sdk/models.py" = ["TCH003"]
