[project]
name = "graphrec-reel-storefront"
version = "0.1.0"
description = "Reel - a MovieLens film store demonstrating GraphRec + DGSR (FastAPI + React)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.10",
  "pydantic-settings>=2.10",
  "graphrec-sdk>=1.0",
  "redis>=5.0",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "numpy>=1.26"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routes"]
