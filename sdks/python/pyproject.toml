[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrec-sdk"
dynamic = ["version"]
description = "Official Python SDK for the GraphRec multi-tenant recommendation platform for e-commerce"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "GraphRec" }]
keywords = ["recommendations", "ecommerce", "recommender-systems", "graphrec", "dgsr", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.25,<1",
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "mypy>=1.8",
  "ruff>=0.5",
]

[tool.setuptools.dynamic]
version = { attr = "graphrec_sdk._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphrec_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["graphrec_sdk"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP045", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM102", "SIM117", "E501"]
"src/graphrec_sdk/_routes.py" = ["E501"]
