[project]
name = "graphrec"
version = "0.1.0"
description = "Multi-tenant recommendation platform-as-a-service"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.141,<0.142",
    # Pinned directly, above FastAPI's own floor. FastAPI 0.141 asks only for
    # `starlette>=0.46.0`, and 0.46.2 carries six advisories that `pip-audit`
    # fails the `security` job on — among them one where `request.url.path` is
    # attacker-controllable through a malformed `Host` header, which is
    # precisely the value the metrics and audit paths read. An open floor in a
    # dependency is not a pin; this is.
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.32,<0.33",
    # `[email]` pulls in email-validator: an email is the account identifier here,
    # and `EmailStr` normalises and validates it rather than each caller inventing
    # its own regex.
    "pydantic[email]>=2.9,<3",
    # SQLAlchemy's async layer runs the sync DBAPI inside a greenlet. It is an
    # optional extra of SQLAlchemy but a hard requirement for `create_async_engine`,
    # so it is pinned here rather than acquired by luck.
    "greenlet>=3.0",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<1.15",
    "psycopg[binary,pool]>=3.2,<3.3",
    "redis>=5.2,<6",
    "argon2-cffi>=23.1,<24",
    "pyjwt[crypto]>=2.10,<3",
    # 48.0.1 is the floor GHSA-537c-gmf6-5ccf sets. Kept as a range rather
    # than a pin so a patch release arrives without a commit here.
    "cryptography>=48.0.1,<51",
    "python-json-logger>=2.0,<3",
    "boto3>=1.35,<2",
    # CON-01 makes DGSR the model family, and `Ultimate §14` names PyTorch.
    # PyTorch Geometric is deliberately *not* here — see ADR 0023. The GNN
    # pathway is three scatter operations, and PyG would add a compiled
    # extension pinned to a torch build for them.
    "torch>=2.5,<3",
    # `numpy` arrives with torch; it is named because the feature builder and
    # the evaluator use it directly rather than by inheritance.
    "numpy>=1.26",
    # "Never `pickle` across a trust boundary" (BACKEND_PLAN §8.4). Phase 10
    # exports bundles with it; Phase 8 writes checkpoints with it for the same
    # reason a checkpoint is also an artifact somebody could swap.
    "safetensors>=0.4,<1",
    # Prometheus and Grafana sit on N1 (BACKEND_PLAN §9.1) and §24 asks for six
    # named alerts, none of which can fire without an exposition endpoint. The
    # client is here rather than hand-rolled because the format's hard parts are
    # histogram bucket semantics and multiprocess collection, and getting either
    # subtly wrong yields a dashboard that is confidently wrong.
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    # 9.0.3 is PYSEC-2026-1845's floor, and pytest-asyncio 1.x is what
    # supports pytest 9. `asyncio_mode = "auto"` survives the major bump; the
    # 1224-test suite was run across it before these pins moved.
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
    "httpx>=0.27,<0.28",
    # Starlette 1.3 deprecated `TestClient` on httpx 0.x and the whole suite
    # runs under `filterwarnings = error`, so the deprecation is a collection
    # error rather than a warning. `httpx` stays for `tests/serving/test_load.py`,
    # which drives the load generator directly.
    "httpx2>=2.0",
    "testcontainers[postgres,redis]>=4.8,<5",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "types-boto3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["graphrec*", "apps*"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["graphrec", "apps", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "TCH", "RUF"]
ignore = [
    "A003",    # shadowing a builtin as an attribute name is fine (e.g. error.class)
    "B008",    # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.isort]
# `graphrec` and `apps` are ours. Declaring them keeps the first-party block
# separate from third-party, so a new import into the shared library is visible
# in a diff rather than sorted into the middle of the framework imports.
known-first-party = ["graphrec", "apps", "graphrec_sdk"]

[tool.ruff.lint.per-file-ignores]
# The README's Python is compiled from this file, so ruff must not rewrite it
# into something a reader cannot paste. The SDK's floor is Python 3.10 while
# this repository targets 3.12, and `UP` would turn `timezone.utc` into
# `datetime.UTC` — correct here, an `ImportError` for a customer on 3.10. The
# imports inside each region are what the block has to show, so `F401` cannot
# prune the ones a nested annotation only appears to use.
"tests/sdk/examples.py" = ["UP", "F401"]
# Pydantic and FastAPI both resolve annotations at runtime — Pydantic to build a
# model's validators, FastAPI to tell an async-generator dependency from a plain
# coroutine. Names used in those annotations must be real imports; moving them
# into a type-checking block raises `NameError` at import time.
"apps/control_api/deps.py" = ["TCH001", "TCH002", "TCH003"]
"apps/control_api/schemas.py" = ["TCH001", "TCH002", "TCH003"]
"apps/control_api/routers/*" = ["TCH001", "TCH002", "TCH003"]
"apps/inference/deps.py" = ["TCH001", "TCH002", "TCH003"]
"apps/inference/schemas.py" = ["TCH001", "TCH002", "TCH003"]
"apps/inference/main.py" = ["TCH001", "TCH002", "TCH003"]
# SQLAlchemy resolves `Mapped[...]` annotations at runtime against
# `type_annotation_map`, so `datetime` and `uuid` must be real imports rather
# than type-checking-only ones. Moving them breaks mapper configuration.
"graphrec/db/models/*" = ["TCH003"]
"tests/*" = ["S101"]
# A test that pins a bound to the prototype reads better as one assertion with a
# message naming the drift than as three anonymous ones.
"tests/contract/*" = ["S101", "PT018", "E501"]
# Alembic's generated preamble annotates module-level identifiers, and the
# migration bodies are deliberately literal SQL rather than model-driven.
"migrations/*" = ["TCH003"]
"graphrec/common/enums.py" = ["E501"]      # generated
"frontend/*" = ["ALL"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/versions/", "^frontend/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pythonjsonlogger.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
# The SDK lives in its own distribution (`sdk/python/pyproject.toml`) but its
# tests run here, inside the same gate as everything else. The alternative — a
# second `pytest` invocation in CI — is a suite that is green until somebody
# forgets to add the step, and `tests/sdk/` is where the contract tests that
# read `graphrec/` and `deploy/` from the other side belong anyway.
pythonpath = ["sdk/python/src"]
asyncio_mode = "auto"
markers = [
    "isolation: cross-tenant isolation suite — a required merge gate",
    "authz: authorization matrix (role x endpoint, permission x endpoint)",
    "contract: parity with the console prototype (enums, routes, error copy)",
    "db: requires a live PostgreSQL",
    "slow: excluded from the per-PR run",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- import-linter

[tool.importlinter]
root_packages = ["graphrec", "apps"]

[[tool.importlinter.contracts]]
name = "Apps depend on the shared library, never on each other"
type = "independence"
modules = [
    "apps.control_api",
    "apps.job_worker",
    "apps.training_worker",
    "apps.reconciler",
    "apps.inference",
]

[[tool.importlinter.contracts]]
name = "The shared library never imports an app"
type = "forbidden"
source_modules = ["graphrec"]
forbidden_modules = ["apps"]

[[tool.importlinter.contracts]]
name = "common is the lowest layer"
type = "forbidden"
source_modules = ["graphrec.common"]
forbidden_modules = [
    "graphrec.domain",
    "graphrec.db",
    "graphrec.storage",
    "graphrec.ml",
    "graphrec.serving_driver",
]
