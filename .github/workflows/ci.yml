# The merge gate.
#
# Six jobs that are not negotiable, and are named so a red run says which
# promise broke:
#
#   * `parity` — the generated enums and the error catalogue still match the
#     console prototype. BUILD_PROMPT calls the prototype an executable
#     specification; this is the only thing that makes that literally true.
#   * `migrations` — the baseline applies *and* reverses against a real
#     PostgreSQL, and the runtime role still cannot bypass row-level security.
#   * `isolation` — the runtime role cannot escape its tenant.
#   * `authz` — the five authorization gates fire in order, and the tenant and
#     platform realms cannot be crossed.
#   * `observability` — the alert rules, dashboards, Caddyfiles, firewall
#     rulesets and Compose files parse, and each still refers to something that
#     exists. None of this is reachable from a test run, because nothing in the
#     suite starts Prometheus or Caddy.
#   * `security` — dependencies, static analysis, image and history.
#
# The last two are required checks from Phase 2 onward, and are separate jobs
# rather than part of `test` so that a red run says which promise broke.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  # CI is not `production`, so `Settings` permits the shipped development
  # secrets. Anything that must never be a default is asserted by
  # `test_production_refuses_default_secrets`, not by this file.
  GRAPHREC_ENVIRONMENT: ci

jobs:
  lint:
    name: Lint, types and module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: mypy
        # The SDK is a separate distribution but it is checked here, under the
        # same `strict = true`: a typed client whose own types are unchecked
        # publishes `.pyi` promises nothing verifies.
        run: mypy graphrec apps sdk/python/src
      - name: Shell scripts
        # The ops scripts are the code that runs during an incident and the only
        # code with no test around it. ShellCheck is what stands in for one:
        # an unquoted `$BACKUP_DIR` is a restore into the wrong database.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            scripts/ops/*.sh
      - name: Module boundaries
        # Contracts in pyproject.toml. The one that matters: the five apps are
        # independent of each other and share only `graphrec`. Without this,
        # `job_worker` importing a control-plane request handler passes review
        # once and is load-bearing forever.
        run: lint-imports

  parity:
    name: Prototype parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Generated enums match the prototype
        # --check regenerates in memory and diffs. It fails both ways: on a
        # hand-edit of the generated file, and on a prototype change that was
        # never propagated.
        run: python scripts/gen_enums.py --check
      - name: Error copy matches the prototype
        run: pytest -m contract -q

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: graphrec_owner
          POSTGRES_PASSWORD: graphrec_owner_local_only
          POSTGRES_DB: graphrec
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GRAPHREC_POSTGRES_HOST: localhost
      GRAPHREC_REDIS_URL: redis://localhost:6379/0
      GRAPHREC_OWNER_DATABASE_URL: postgresql+psycopg://graphrec_owner:graphrec_owner_local_only@localhost:5432/graphrec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Signing keypair
        # Generated per run and never persisted. A committed key would be a
        # published key.
        run: python scripts/gen_jwt_keys.py --kid ci-1
      - run: alembic upgrade head
      - name: Full suite
        run: pytest -q --cov=graphrec --cov=apps --cov-report=term-missing

  isolation:
    name: Tenant isolation (required)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: graphrec_owner
          POSTGRES_PASSWORD: graphrec_owner_local_only
          POSTGRES_DB: graphrec
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GRAPHREC_POSTGRES_HOST: localhost
      GRAPHREC_OWNER_DATABASE_URL: postgresql+psycopg://graphrec_owner:graphrec_owner_local_only@localhost:5432/graphrec
      # Locally, a developer with no database gets a skip. Here a skip is a
      # failure: a required gate that reports green because it found nothing to
      # run is worse than no gate at all.
      GRAPHREC_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - name: The runtime role cannot escape its tenant
        # BUILD_PROMPT §14: this suite is a required merge gate. It is separated
        # from `test` so that a red run names the failure "tenant isolation"
        # rather than "tests", which is the difference between a revert and a
        # debate. Phase 1 covers the role privileges the policies rest on; the
        # cross-tenant row tests join it from Phase 2.
        run: pytest -m isolation -q

  authz:
    name: Authorization matrix (required)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: graphrec_owner
          POSTGRES_PASSWORD: graphrec_owner_local_only
          POSTGRES_DB: graphrec
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GRAPHREC_POSTGRES_HOST: localhost
      GRAPHREC_OWNER_DATABASE_URL: postgresql+psycopg://graphrec_owner:graphrec_owner_local_only@localhost:5432/graphrec
      GRAPHREC_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Signing keypair
        run: python scripts/gen_jwt_keys.py --kid ci-1
      - run: alembic upgrade head
      - name: The five gates run in order, and the realms do not meet
        # Separated from `test` for the same reason `isolation` is: a red run
        # here names the broken promise. Isolation says a tenant cannot reach
        # another tenant's rows; this says the gates in front of those rows fire
        # in the right order — identity, tenant state, role, ownership, resource
        # state — and that a foreign resource is a 404 and never a 403.
        run: pytest -m authz -q

  migrations:
    name: Migrations apply and reverse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: graphrec_owner
          POSTGRES_PASSWORD: graphrec_owner_local_only
          POSTGRES_DB: graphrec
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GRAPHREC_OWNER_DATABASE_URL: postgresql+psycopg://graphrec_owner:graphrec_owner_local_only@localhost:5432/graphrec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Upgrade
        run: alembic upgrade head
      - name: The runtime role cannot bypass RLS
        # Asserted here as well as inside the migration, because this is the
        # property the entire isolation model rests on and it fails silently.
        run: |
          PGPASSWORD=graphrec_owner_local_only psql -h localhost -U graphrec_owner -d graphrec \
            -v ON_ERROR_STOP=1 -tAc \
            "SELECT CASE WHEN rolsuper OR rolbypassrls OR rolcreaterole
                         THEN 1/0 ELSE 1 END
               FROM pg_roles WHERE rolname = 'graphrec_app'"
      - name: Downgrade to base
        # A migration that cannot be reversed is a migration that cannot be
        # rolled back at 3am.
        run: alembic downgrade base
      - name: Upgrade again
        # Re-applying over a role the first run already created is the case that
        # actually breaks: `CREATE ROLE` has no `IF NOT EXISTS`.
        run: alembic upgrade head

  observability:
    name: Alerts, dashboards and runbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      # The three configuration files that are never exercised by a test run,
      # because nothing in the test suite starts Prometheus. A rule with a typo
      # in its expression is a valid YAML document and an alert that never
      # fires, and the first time anyone finds out is the incident it was
      # written for.
      - name: promtool
        run: |
          docker run --rm -v "$PWD/deploy/observability:/cfg:ro" \
            --entrypoint promtool prom/prometheus:v2.54.1 \
            check config /cfg/prometheus.yml
          docker run --rm -v "$PWD/deploy/observability:/cfg:ro" \
            --entrypoint promtool prom/prometheus:v2.54.1 \
            check rules /cfg/alerts.yml
      - name: amtool
        run: |
          docker run --rm -v "$PWD/deploy/observability:/cfg:ro" \
            --entrypoint amtool prom/alertmanager:v0.27.0 \
            check-config /cfg/alertmanager.yml
      - name: Caddyfiles
        run: |
          for node in n1 n3; do
            docker run --rm -v "$PWD/deploy/$node:/etc/caddy:ro" caddy:2-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: nftables rulesets
        run: |
          for node in n1 n2 n3; do
            docker run --rm --cap-add NET_ADMIN --cap-add NET_RAW \
              -v "$PWD/deploy/firewall:/rules:ro" alpine:3.20 \
              sh -c "apk add --quiet nftables && nft -c -f /rules/$node.nft"
          done
      - name: Compose files
        run: |
          export WG_N1=10.10.0.1 WG_N2=10.10.0.2 WG_N3=10.10.0.3
          export GRAPHREC_IMAGE_TAG=ci GRAPHREC_CONSOLE_DOMAIN=console.invalid
          export GRAPHREC_API_DOMAIN=api.invalid GRAPHREC_ACME_EMAIL=ci@invalid
          for node in n1 n2 n3; do
            docker compose -f "deploy/$node/docker-compose.yml" config >/dev/null
          done

      # And the half that *is* a test suite: that every alert has a runbook
      # section, every dashboard panel queries a metric this code publishes, and
      # every API call written down in a runbook exists in the OpenAPI document.
      - name: Contracts between the alerts, the dashboards and the runbooks
        run: pytest tests/observability tests/deploy -q

  security:
    name: Security scan
    runs-on: ubuntu-latest
    # Not `continue-on-error`. A scan whose result is advisory is a scan nobody
    # reads. Where a finding is accepted it is accepted explicitly, in
    # `.trivyignore` or a pip-audit `--ignore-vuln`, with a reason — which is a
    # record of a decision rather than a permanently amber check.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependencies
        # `[dev]` as well as the runtime set. A vulnerable test runner is not a
        # vulnerability in the product and it is still a vulnerability on the
        # machine that runs CI with repository credentials in its environment.
        #
        # `--skip-editable`, not `--strict`: the repository installs itself as
        # an editable `graphrec`, which is not on PyPI and cannot be audited.
        # `--strict` fails on that every time, which is a check that is red for
        # a reason unrelated to security.
        run: |
          pip install pip-audit
          pip install -e ".[dev]"
          pip-audit --skip-editable --desc
      - name: Node dependencies
        # `--omit=dev` on purpose: a development-only advisory in a build tool
        # is worth knowing about and is not a vulnerability in the shipped
        # bundle, and conflating the two is how the whole check gets muted.
        run: npm audit --audit-level=high --omit=dev
        working-directory: frontend

      - name: Static analysis
        # `bandit` on the application code only. The `-ll` floor is medium
        # severity and above: the low band is dominated by `assert` in tests and
        # `subprocess` in the serving driver, both of which are deliberate and
        # both of which would train people to pass `--exit-zero`.
        #
        # `-ii` as well as `-ll`: medium confidence and above. The low band here
        # is fifteen `B608` hits on `sa.text(f"...")`, every one of which
        # interpolates a module-level constant and binds every value. Raising
        # the confidence floor rather than adding fifteen `# nosec` comments,
        # because fifteen suppressions is how the sixteenth gets added without
        # anyone reading it. The one genuine finding — binding the metrics
        # listener to all interfaces — is annotated at the line instead.
        run: |
          pip install bandit
          bandit -r graphrec apps -ll -ii

      - name: Image and filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          # Secrets *and* misconfiguration. The second one is why this scans the
          # repository rather than only the built image: the Compose files, the
          # systemd units and the Dockerfile are as capable of being the
          # vulnerability as any dependency is.
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Secrets that were once committed
        # History, not the working tree. A key removed in a later commit is
        # still a published key, and `trivy fs` above only sees the checkout.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Console
    runs-on: ubuntu-latest
    # The console is scaffolded from Phase 12. Until then there is nothing to
    # build, and a job that fails for that reason trains people to ignore red.
    if: ${{ hashFiles('frontend/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: ESLint
        run: npm run lint
        working-directory: frontend
      - name: Types
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Tests
        # Added in Phase 16. The console had 116 tests and CI ran none of them:
        # `lint`, `tsc` and `build` all pass on a component that renders the
        # wrong thing.
        run: npm run test
        working-directory: frontend
      - name: The generated client matches the published document
        # `--check` regenerates from `openapi.json` and diffs. This is the other
        # half of `parity`: the prototype pins the copy, this pins the wire.
        run: npm run gen:client:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  sdk:
    name: Client SDKs
    runs-on: ubuntu-latest
    # The TypeScript SDK is a separate npm workspace with its own lockfile. The
    # Python SDK has no job of its own: `tests/sdk/` runs inside `test`, because
    # a second `pytest` invocation is a suite that stays green until somebody
    # forgets to add the step.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
        working-directory: sdk/typescript
      - name: ESLint
        run: npm run lint
        working-directory: sdk/typescript
      - name: Types
        run: npm run typecheck
        working-directory: sdk/typescript
      - name: Tests
        # Includes the README test, which executes every documented example
        # against a recording transport. A snippet that no longer compiles fails
        # here rather than in somebody's first hour with the SDK.
        run: npm run test
        working-directory: sdk/typescript
      - name: Build
        # Emits ESM and CJS. Node 20 — the declared floor — cannot `require()`
        # ESM, so a package that promises `require` and ships only ESM is broken
        # for every CommonJS consumer and green in every other check.
        run: npm run build
        working-directory: sdk/typescript
      - name: Both entry points load
        run: |
          node -e "import('./dist/index.js').then(m => console.log('esm', m.VERSION))"
          node -e "console.log('cjs', require('./dist/cjs/index.js').VERSION)"
        working-directory: sdk/typescript
