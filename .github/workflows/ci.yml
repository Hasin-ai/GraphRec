# The merge gate.
#
# Two jobs that are not negotiable, and are named so a red run says which
# promise broke:
#
#   * `parity` — the generated enums and the error catalogue still match the
#     console prototype. BUILD_PROMPT calls the prototype an executable
#     specification; this is the only thing that makes that literally true.
#   * `migrations` — the baseline applies *and* reverses against a real
#     PostgreSQL, and the runtime role still cannot bypass row-level security.
#
# `pytest -m isolation` is a required check from Phase 2 onward. It is wired up
# now, while there is nothing for it to run, so that adding the first isolation
# test does not also require someone to remember to add the gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  # CI is not `production`, so `Settings` permits the shipped development
  # secrets. Anything that must never be a default is asserted by
  # `test_production_refuses_default_secrets`, not by this file.
  GRAPHREC_ENVIRONMENT: ci

jobs:
  lint:
    name: Lint, types and module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy graphrec apps
      - name: Module boundaries
        # Contracts in pyproject.toml. The one that matters: the five apps are
        # independent of each other and share only `graphrec`. Without this,
        # `job_worker` importing a control-plane request handler passes review
        # once and is load-bearing forever.
        run: lint-imports

  parity:
    name: Prototype parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Generated enums match the prototype
        # --check regenerates in memory and diffs. It fails both ways: on a
        # hand-edit of the generated file, and on a prototype change that was
        # never propagated.
        run: python scripts/gen_enums.py --check
      - name: Error copy matches the prototype
        run: pytest -m contract -q

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: graphrec_owner
          POSTGRES_PASSWORD: graphrec_owner_local_only
          POSTGRES_DB: graphrec
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GRAPHREC_POSTGRES_HOST: localhost
      GRAPHREC_REDIS_URL: redis://localhost:6379/0
      GRAPHREC_OWNER_DATABASE_URL: postgresql+psycopg://graphrec_owner:graphrec_owner_local_only@localhost:5432/graphrec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Signing keypair
        # Generated per run and never persisted. A committed key would be a
        # published key.
        run: python scripts/gen_jwt_keys.py --kid ci-1
      - run: alembic upgrade head
      - name: Full suite
        run: pytest -q --cov=graphrec --cov=apps --cov-report=term-missing

  isolation:
    name: Tenant isolation (required)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: graphrec_owner
          POSTGRES_PASSWORD: graphrec_owner_local_only
          POSTGRES_DB: graphrec
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GRAPHREC_POSTGRES_HOST: localhost
      GRAPHREC_OWNER_DATABASE_URL: postgresql+psycopg://graphrec_owner:graphrec_owner_local_only@localhost:5432/graphrec
      # Locally, a developer with no database gets a skip. Here a skip is a
      # failure: a required gate that reports green because it found nothing to
      # run is worse than no gate at all.
      GRAPHREC_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - name: The runtime role cannot escape its tenant
        # BUILD_PROMPT §14: this suite is a required merge gate. It is separated
        # from `test` so that a red run names the failure "tenant isolation"
        # rather than "tests", which is the difference between a revert and a
        # debate. Phase 1 covers the role privileges the policies rest on; the
        # cross-tenant row tests join it from Phase 2.
        run: pytest -m isolation -q

  migrations:
    name: Migrations apply and reverse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: graphrec_owner
          POSTGRES_PASSWORD: graphrec_owner_local_only
          POSTGRES_DB: graphrec
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GRAPHREC_OWNER_DATABASE_URL: postgresql+psycopg://graphrec_owner:graphrec_owner_local_only@localhost:5432/graphrec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Upgrade
        run: alembic upgrade head
      - name: The runtime role cannot bypass RLS
        # Asserted here as well as inside the migration, because this is the
        # property the entire isolation model rests on and it fails silently.
        run: |
          PGPASSWORD=graphrec_owner_local_only psql -h localhost -U graphrec_owner -d graphrec \
            -v ON_ERROR_STOP=1 -tAc \
            "SELECT CASE WHEN rolsuper OR rolbypassrls OR rolcreaterole
                         THEN 1/0 ELSE 1 END
               FROM pg_roles WHERE rolname = 'graphrec_app'"
      - name: Downgrade to base
        # A migration that cannot be reversed is a migration that cannot be
        # rolled back at 3am.
        run: alembic downgrade base
      - name: Upgrade again
        # Re-applying over a role the first run already created is the case that
        # actually breaks: `CREATE ROLE` has no `IF NOT EXISTS`.
        run: alembic upgrade head

  frontend:
    name: Console
    runs-on: ubuntu-latest
    # The console is scaffolded from Phase 12. Until then there is nothing to
    # build, and a job that fails for that reason trains people to ignore red.
    if: ${{ hashFiles('frontend/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
