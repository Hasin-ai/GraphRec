<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphRec: Recommendations that learn from every interaction</title>
    <meta name="description" content="GraphRec is a multi-tenant recommendation platform for e-commerce. Sync your catalog, stream shopper events, train time-aware graph models on your own history, and serve real-time Top-N recommendations." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f13" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GraphRec" />
    <meta property="og:title" content="GraphRec: Recommendations that learn from every interaction" />
    <meta property="og:description" content="A multi-tenant recommendation platform for e-commerce: catalog sync, event streaming, time-aware graph models and real-time Top-N recommendations." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GraphRec: Recommendations that learn from every interaction" />
    <meta name="twitter:description" content="A multi-tenant recommendation platform for e-commerce: catalog sync, event streaming, time-aware graph models and real-time Top-N recommendations." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* Pre-paint theme: same rule as hooks/useTheme.ts, applied before React mounts so there is no light-to-dark flash. */
      (function () {
        var theme = "light";
        try {
          var stored = window.localStorage.getItem("graphrec.theme");
          if (stored === "light" || stored === "dark") theme = stored;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (e) {
          try { if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark"; } catch (e2) { /* ignore */ }
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
