# One origin for the whole product: marketing site and consoles (SPA), the API
# under /v1, health probes and the API reference. The API container is reached
# only through this proxy.
server {
  listen 80;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # A-14: security headers on every response, including proxied API responses.
  # The SPA loads only its own bundles, styles and images.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  # HSTS is set by the TLS terminator in production (see docs/DEPLOYMENT.md);
  # sending it over plain HTTP here would be ignored by browsers.

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  set $api_upstream api:8000;

  location /v1/ {
    client_max_body_size 10m;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # A-27: health comes from the API, never a constant answered by nginx.
  location ~ ^/(healthz|readyz)$ {
    access_log off;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  # API reference (Swagger UI and its schema). The UI's own assets come from a CDN,
  # so this location relaxes CSP for that page only.
  location ~ ^/(docs|openapi\.json)$ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'" always;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
