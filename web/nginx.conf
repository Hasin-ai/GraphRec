# One origin for the whole product: marketing site and consoles (SPA), the API
# under /v1, health probes and the API reference. The API container is reached
# only through this proxy.
# Keep the scheme the edge proxy (Caddy) saw; fall back to ours when called directly.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # A-14: security headers on every response, including proxied API responses.
  # The SPA loads only its own bundles, styles and images.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  # HSTS is set by the TLS terminator in production (see docs/DEPLOYMENT.md);
  # sending it over plain HTTP here would be ignored by browsers.

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  set $api_upstream api:8000;

  # One public URL (PUBLIC_ORIGIN, e.g. https://graphrec.example.com). When it is set,
  # a browser that opens a page by another address - the VM's raw IP and port, say - is
  # sent to the same path on the public origin, so the home page, the docs and the
  # consoles always share one domain. Requests that already came through the public
  # edge (a Cloudflare tunnel adds CF-Ray) or name the public host are served as-is.
  # API, health and asset paths are never redirected, so SDK clients and probes that
  # use the direct address keep working. Empty (the default) disables the redirect.
  set $public_origin "${PUBLIC_ORIGIN}";
  set $canonical_redirect 1;
  if ($public_origin = "") { set $canonical_redirect ""; }
  if ($http_cf_ray != "") { set $canonical_redirect ""; }
  set $request_origin_https "https://$http_host";
  set $request_origin_http "http://$http_host";
  if ($request_origin_https = $public_origin) { set $canonical_redirect ""; }
  if ($request_origin_http = $public_origin) { set $canonical_redirect ""; }

  location /v1/ {
    client_max_body_size 10m;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # A-27: health comes from the API, never a constant answered by nginx.
  location ~ ^/(healthz|readyz)$ {
    access_log off;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  # Raw OpenAPI schema and swagger fallback. The developer documentation is served by the SPA.
  location ~ ^/(api-docs|openapi\.json)$ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'" always;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    if ($canonical_redirect) { return 301 $public_origin$request_uri; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
