# Local stack. `docker compose up` must yield a healthy stack (Phase 1 exit
# criterion). Postgres, Redis and object storage only — no broker, no
# Kubernetes, no vector database. Each of those was considered and rejected
# (BACKEND_PLAN §8.6); D2/D3/D4 record why.

name: graphrec

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-graphrec}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-graphrec_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-graphrec_owner_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -U matches the owner role; the default would probe a role that does not exist.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-graphrec_owner} -d ${POSTGRES_DB:-graphrec}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    # Nothing authoritative lives in Redis, so persistence is off deliberately:
    # rate-limit counters and locks are reconstructible, and an AOF here would
    # imply a durability guarantee the design does not make.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-graphrec_local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-graphrec_local_secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio_init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-graphrec_local} ${S3_SECRET_KEY:-graphrec_local_secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-graphrec} &&
      mc anonymous set none local/${S3_BUCKET:-graphrec} &&
      echo 'bucket ready'
      "
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GRAPHREC_OWNER_DATABASE_URL: postgresql+psycopg://${POSTGRES_OWNER_USER:-graphrec_owner}:${POSTGRES_OWNER_PASSWORD:-graphrec_owner_local_only}@postgres:5432/${POSTGRES_DB:-graphrec}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-graphrec_app_local_only}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: postgres
      POSTGRES_APP_USER: graphrec_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-graphrec_app_local_only}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      LOG_FORMAT: ${LOG_FORMAT:-json}
    env_file:
      - path: .env
        required: false
    volumes:
      # Mounted, never baked. `secrets/` is ignored by both git and Docker, so
      # the signing key exists only on the host that generated it — a key in an
      # image layer is a published key, and every token issued under it is
      # forgeable. Read-only: the API verifies and signs, it never writes here.
      # Generate with `python scripts/gen_jwt_keys.py` before the first `up`.
      - ./secrets:/app/secrets:ro
    ports:
      - "${API_PORT:-8010}:8010"
    command:
      ["uvicorn", "apps.control_api.main:app", "--host", "0.0.0.0", "--port", "8010"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Behind a profile, so `docker compose up` does not start it.
  #
  # Not because it is optional — the platform does not work without it — but
  # because a worker with an empty handler registry refuses to start, and until
  # Phase 6 registers the ingestion handlers that is exactly what this is. A
  # service that crash-loops on a fresh clone teaches everybody to ignore
  # restarts, which is the one signal that has to keep meaning something.
  #
  # Start it with:  docker compose --profile workers up job_worker
  job_worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: postgres
      POSTGRES_APP_USER: graphrec_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-graphrec_app_local_only}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      LOG_FORMAT: ${LOG_FORMAT:-json}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "apps.job_worker.main"]
    # A worker holds leases. `SIGTERM` makes it stop claiming and drain what it
    # already has, and the grace period has to outlast a job that is mid-stage —
    # otherwise the kill leaves a `running` row for the sweeper to requeue, and
    # every deploy manufactures retries. Longer than job_lease_seconds (120).
    stop_grace_period: 150s
    restart: unless-stopped

  # Same profile, separate process. `job_worker` claims ingestion and
  # `training_worker` claims training, because a four-hour training run holding
  # a slot in a shared pool is a queue of CSV uploads that never drains.
  #
  # Deliberately not replicated. ASM-03 wants training serialised platform-wide
  # and the schema only enforces one active job *per tenant*, so today the
  # global rule is "run one of these" — see docs/PHASE_9_REPORT.md §3.
  training_worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: postgres
      POSTGRES_APP_USER: graphrec_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-graphrec_app_local_only}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # One at a time within the process too. Two concurrent runs on one box
      # contend for every core and finish later than they would in sequence.
      WORKER_CONCURRENCY: 1
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "apps.training_worker.main"]
    # Longer than job_worker's, and for a different reason: draining here means
    # letting the current epoch reach a checkpoint. An epoch is minutes, so ten
    # of them is the budget, and a run killed past it resumes from its last
    # checkpoint rather than from nothing.
    stop_grace_period: 600s
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
